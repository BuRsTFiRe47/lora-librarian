name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        # --onedir (not --onefile) and --noupx: onefile's self-extracting
        # behavior and UPX-compressed binaries are the two biggest
        # triggers for antivirus false positives (e.g. Windows Defender
        # flagging PyInstaller builds as "Trojan:Win32/Wacatac.B!ml").
        # A plain folder build is far less likely to be flagged.
        run: |
          pyinstaller --noconfirm --onedir --windowed --noupx --name LoRALibrarian main.py

      - name: Zip the build folder
        run: |
          Compress-Archive -Path dist/LoRALibrarian/* -DestinationPath LoRALibrarian-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoRALibrarian-windows
          path: LoRALibrarian-windows.zip

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: LoRALibrarian-windows
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoRALibrarian-windows.zip
          generate_release_notes: true
